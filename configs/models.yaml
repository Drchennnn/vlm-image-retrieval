models:
  clip_vit_b32:
    model_name: "ViT-B-32"
    pretrained: "openai"
    backbone: "ViT-B/32"
    loss_type: "softmax_infonce"
    context_length: 77
    quick_gelu: true
    description: "OpenAI CLIP ViT-B/32 baseline (Softmax InfoNCE, QuickGELU)"

  clip_rn50:
    model_name: "RN50"
    pretrained: "openai"
    backbone: "ResNet-50"
    loss_type: "softmax_infonce"
    context_length: 77
    quick_gelu: true
    description: "OpenAI CLIP ResNet-50 CNN comparison (Softmax InfoNCE, QuickGELU)"

  siglip_vit_b16:
    model_name: "ViT-B-16-SigLIP"
    pretrained: "webli"
    backbone: "ViT-B/16"
    loss_type: "sigmoid_pairwise"
    context_length: 64
    quick_gelu: false
    description: "SigLIP ViT-B/16 (Sigmoid pairwise contrastive loss)"
